[build-system]
requires = ['setuptools>=42']
build-backend = 'setuptools.build_meta'

[project]
name = "medtermex"
version = "0.2.0"
description = "A project for training and evaluating medical term extraction models"
requires-python = ">=3.10"
authors = [
    {name = "Erik Novak", email = "erik.novak@ijs.si"},
    {name = "Erik Calcina", email = "erik.calcina@ijs.si"},
]
maintainers = [
    {name = "Erik Novak", email = "erik.novak@ijs.si"}
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = [
    "python",
    "machine learning",
    "natural language processing"
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "spacy>=3.8,<4",
    "torch",
    "accelerate>=1.0,<2",
    "datasets>=3.0,<5",
    "nltk>=3.9,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "tqdm>=4.66,<5",
    "marimo[recommended]>=0.13,<1",
    "ipywidgets>=8.1,<9",
    "ipython>=8.20",
]

[project.urls]
"Homepage" = "https://github.com/E3-JSI/medtermex"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
# NOTE: Although gliner 0.2.26+ and unsloth 2026.5+ both accept
# transformers >=4.51.3, we keep them as separate extras to avoid
# subtle conflicts (tokenizers, accelerate, CUDA wheels). Install
# one extra at a time:
#   pip install -e ".[gliner]"   OR   pip install -e ".[unsloth]"
gliner = [
    "gliner>=0.2.26,<0.3",
    "transformers>=4.51.3,<5.7",
    "timm>=1.0,<2",
]
unsloth = [
    "unsloth>=2026.5.2,<2027",
    "unsloth-zoo>=2026.5.1,<2027",
    "trl>=0.24,<0.25",
    # transformers>=4.51.3 installed automatically by unsloth
]
ollama = [
    "ollama",
]
dev = [
    "black",
    "isort",
    "flake8",
    "flake8-pyproject",
]
# Separate 'all' extras due to gliner/unsloth incompatibility
all-gliner = [
    "medtermex[gliner,ollama,dev]",
]
all-unsloth = [
    "medtermex[unsloth,ollama,dev]",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
ignore = ["E731", "E501", "W503"]
exclude = [".git", ".github", "data", "docs", "logs", "results",  "models", "results"]
